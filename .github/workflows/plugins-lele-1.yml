# Generated by node scripts/generate-plugin-workflows.mjs; edit plugins/catalog.json instead.
name: 'Plugins - Stronghold-Protocol-Lele-Mods (1)'

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Game release, branch, tag or SHA; latest follows the latest stable release'
        type: string
        default: 'latest'
      include_assets:
        description: 'Include game art/audio and plugin art'
        type: boolean
        default: true
      image_tag:
        description: 'Custom image tag; required when any plugin is selected; never latest'
        type: string
        default: ''
      additional_plugins:
        description: 'Optional comma-separated keys from another page/repository, e.g. forge/theme-night'
        type: string
        default: ''
      p_lele_damage:
        description: 'Stronghold-Protocol-Lele-Mods + 伤害统计'
        type: boolean
        default: false
      p_lele_factions:
        description: 'Stronghold-Protocol-Lele-Mods + 更多阵营'
        type: boolean
        default: false
      p_lele_lucky:
        description: 'Stronghold-Protocol-Lele-Mods + 恭喜发财'
        type: boolean
        default: false
      p_lele_operators:
        description: 'Stronghold-Protocol-Lele-Mods + 新干员包'
        type: boolean
        default: false
      p_lele_recruits:
        description: 'Stronghold-Protocol-Lele-Mods + 额外干员包'
        type: boolean
        default: false
      p_lele_relics:
        description: 'Stronghold-Protocol-Lele-Mods + 收藏品玩法'
        type: boolean
        default: false
      p_lele_rounds:
        description: 'Stronghold-Protocol-Lele-Mods + 额外 4 回合'
        type: boolean
        default: false
      p_lele_targeted:
        description: 'Stronghold-Protocol-Lele-Mods + 定向甄选'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref }}
      include_assets: ${{ inputs.include_assets }}
      image_tag: ${{ inputs.image_tag }}
      plugins: >-
        ${{ inputs.p_lele_damage && 'lele/lele-damage,' || '' }}
        ${{ inputs.p_lele_factions && 'lele/lele-factions,' || '' }}
        ${{ inputs.p_lele_lucky && 'lele/lele-lucky,' || '' }}
        ${{ inputs.p_lele_operators && 'lele/lele-operators,' || '' }}
        ${{ inputs.p_lele_recruits && 'lele/lele-recruits,' || '' }}
        ${{ inputs.p_lele_relics && 'lele/lele-relics,' || '' }}
        ${{ inputs.p_lele_rounds && 'lele/lele-rounds,' || '' }}
        ${{ inputs.p_lele_targeted && 'lele/lele-targeted,' || '' }}
        ${{ inputs.additional_plugins }}
    secrets: inherit
