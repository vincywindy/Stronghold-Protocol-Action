# Generated by node scripts/generate-plugin-workflows.mjs; edit plugins/catalog.json instead.
name: 'Plugins - Stronghold-Protocol-Forge-Mods (2)'

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Game release, branch, tag or SHA; latest follows the latest stable release'
        type: string
        default: 'latest'
      include_assets:
        description: 'Include game art/audio and plugin art'
        type: boolean
        default: true
      image_tag:
        description: 'Custom image tag; required when any plugin is selected; never latest'
        type: string
        default: ''
      additional_plugins:
        description: 'Optional comma-separated keys from another page/repository, e.g. forge/theme-night'
        type: string
        default: ''
      p_prep_loadout:
        description: 'Stronghold-Protocol-Forge-Mods + 休整期可更换技能和模组mod'
        type: boolean
        default: false
      p_shop_bond_bias:
        description: 'Stronghold-Protocol-Forge-Mods + 商店刷新盟约装备几率提升mod'
        type: boolean
        default: false
      p_skin_catalogue:
        description: 'Stronghold-Protocol-Forge-Mods + 时装目录（皮肤数据）'
        type: boolean
        default: false
      p_skin_picker:
        description: 'Stronghold-Protocol-Forge-Mods + 皮肤选择器（换装）'
        type: boolean
        default: false
      p_srv_notice:
        description: 'Stronghold-Protocol-Forge-Mods + 服务器公告'
        type: boolean
        default: false
      p_strawberry_ui:
        description: 'Stronghold-Protocol-Forge-Mods + 草莓美化包（纯 CSS）'
        type: boolean
        default: false
      p_theme_night:
        description: 'Stronghold-Protocol-Forge-Mods + 夜间高对比主题'
        type: boolean
        default: false
      p_unequip:
        description: 'Stronghold-Protocol-Forge-Mods + 装备拆卸mod'
        type: boolean
        default: false
      p_ws_compression_reference:
        description: 'Stronghold-Protocol-Forge-Mods + WS 压缩参考（协商参数 / 档位 / 实测）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref }}
      include_assets: ${{ inputs.include_assets }}
      image_tag: ${{ inputs.image_tag }}
      plugins: >-
        ${{ inputs.p_prep_loadout && 'forge/prep-loadout,' || '' }}
        ${{ inputs.p_shop_bond_bias && 'forge/shop-bond-bias,' || '' }}
        ${{ inputs.p_skin_catalogue && 'forge/skin-catalogue,' || '' }}
        ${{ inputs.p_skin_picker && 'forge/skin-picker,' || '' }}
        ${{ inputs.p_srv_notice && 'forge/srv-notice,' || '' }}
        ${{ inputs.p_strawberry_ui && 'forge/strawberry-ui,' || '' }}
        ${{ inputs.p_theme_night && 'forge/theme-night,' || '' }}
        ${{ inputs.p_unequip && 'forge/unequip,' || '' }}
        ${{ inputs.p_ws_compression_reference && 'forge/ws-compression-reference,' || '' }}
        ${{ inputs.additional_plugins }}
    secrets: inherit
