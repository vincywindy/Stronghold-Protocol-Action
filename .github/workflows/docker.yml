name: Build and publish Docker image

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - 'tests/**'
      - 'plugins/**'
      - 'compose.yaml'
      - '.env.example'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - 'tests/**'
      - 'plugins/**'
      - 'compose.yaml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'latest = latest stable Release; or branch/tag/SHA. Empty follows UPSTREAM_REF.'
        type: string
        required: false
      include_assets:
        description: 'Include public art/audio and same-release local art (including 3D board)'
        type: boolean
        default: true
      image_tag:
        description: 'Custom image tag (required with plugins; latest/sha/release tags are reserved)'
        type: string
        default: ''
      plugins:
        description: '补充插件（可选）：用逗号分隔 source/id，与下方选择合并，支持跨仓库'
        type: string
        default: ''
      # BEGIN GENERATED PLUGIN INPUTS
      # Generated by scripts/generate-plugin-workflows.mjs from plugins/catalog.json.
      plugin_01:
        description: '插件 1（所有仓库，可混选；默认不添加）'
        type: choice
        default: '不添加插件'
        options:
          - '不添加插件'
          - 'Stronghold-Protocol-Forge-Mods + 颂乐人偶 [forge/ave-mujica]'
          - 'Stronghold-Protocol-Forge-Mods + 领袖固定血量（0.1.x 口径） [forge/boss-fixed-pool]'
          - 'Stronghold-Protocol-Forge-Mods + 房间容量看板（4/8/12/16/20 展示与预览） [forge/capacity-panel]'
          - 'Stronghold-Protocol-Forge-Mods + CDN 源选择（最快镜像） [forge/cdn-source]'
          - 'Stronghold-Protocol-Forge-Mods + 局内文字聊天（房内气泡） [forge/chat-bubble]'
          - 'Stronghold-Protocol-Forge-Mods + 伤害看板（结算页） [forge/dmg-board]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 素材容器（客户端导出 · 非商业） [forge/duel-assets]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 文案与不兼容清单 [forge/duel-copy]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 规则资料（只读） [forge/duel-data]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 参战单位表（只读） [forge/duel-fighter]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 玩法叠加层（服务端驱动） [forge/duel-mode]'
          - 'Stronghold-Protocol-Forge-Mods + 争锋频道 · 接入状态面板（只读） [forge/duel-panel]'
          - 'Stronghold-Protocol-Forge-Mods + 灵巧盟约装备 [forge/fanpack-skillful-items]'
          - 'Stronghold-Protocol-Forge-Mods + 健康与构建只读接口（/healthz 扩展 + /client-build 字段契约） [forge/healthz-ext]'
