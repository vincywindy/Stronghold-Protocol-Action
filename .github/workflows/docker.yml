          - 'Stronghold-Protocol-Forge-Mods + 商店刷新盟约装备几率提升mod [forge/shop-bond-bias]'
          - 'Stronghold-Protocol-Forge-Mods + 时装目录（皮肤数据） [forge/skin-catalogue]'
          - 'Stronghold-Protocol-Forge-Mods + 皮肤选择器（换装） [forge/skin-picker]'
          - 'Stronghold-Protocol-Forge-Mods + 服务器公告 [forge/srv-notice]'
