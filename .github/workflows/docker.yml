name: Build and publish Docker image

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - 'tests/**'
      - 'compose.yaml'
      - '.env.example'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'scripts/**'
      - 'tests/**'
      - 'compose.yaml'
      - '.env.example'
  schedule:
    # Daily at 03:23 UTC / 11:23 Asia/Shanghai, including upstream/base-image updates.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch, tag or full SHA; empty follows UPSTREAM_REF (default: master)'
        type: string
        required: false
      include_assets:
        description: 'Download upstream public art/audio into the image'
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publishers on the default branch so an older run cannot overwrite a newer latest.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REPOSITORY: sganggs/Stronghold-Protocol
  TRACKED_REF: ${{ vars.UPSTREAM_REF || 'master' }}
  UPSTREAM_REF: ${{ inputs.upstream_ref || vars.UPSTREAM_REF || 'master' }}
  NODE_IMAGE: ${{ vars.NODE_IMAGE || 'node:22-alpine' }}
  # PRs validate the recipe without the large asset download. Manual choices override variables.
  FETCH_ASSETS: >-
    ${{ github.event_name == 'pull_request' && '0' ||
        github.event_name == 'workflow_dispatch' && (inputs.include_assets && '1' || '0') ||
        vars.FETCH_ASSETS || '1' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test image publishing rules
        run: node --test tests/*.test.mjs
      - name: Validate workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color .github/workflows/docker.yml
      - name: Validate Compose configuration
        env:
          IMAGE: ghcr.io/example/stronghold-protocol-action:latest
        run: docker compose config --quiet

  build:
    needs: validate
    # Push builds publish only from the repository's default branch.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          persist-credentials: false

      - name: Resolve image tags and source revision
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)
          export UPSTREAM_SHA
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          node scripts/image-metadata.mjs

      - name: Set up ARM emulation
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          tags: stronghold-test:amd64
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            FETCH_ASSETS=${{ env.FETCH_ASSETS }}
          cache-from: type=gha,scope=amd64-assets${{ env.FETCH_ASSETS }}
          cache-to: type=gha,mode=max,scope=amd64-assets${{ env.FETCH_ASSETS }}

      - name: Test amd64 container
        run: bash scripts/smoke-image.sh stronghold-test:amd64 linux/amd64

      - name: Build arm64 image for testing
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          pull: true
          tags: stronghold-test:arm64
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            FETCH_ASSETS=${{ env.FETCH_ASSETS }}
          cache-from: type=gha,scope=arm64-assets${{ env.FETCH_ASSETS }}
          cache-to: type=gha,mode=max,scope=arm64-assets${{ env.FETCH_ASSETS }}

      - name: Test arm64 container
        if: github.event_name != 'pull_request'
        run: bash scripts/smoke-image.sh stronghold-test:arm64 linux/arm64

      - name: Log in to GHCR
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested multi-platform image
        id: publish
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            FETCH_ASSETS=${{ env.FETCH_ASSETS }}
          labels: |
            org.opencontainers.image.title=Stronghold Protocol
            org.opencontainers.image.description=Unofficial Stronghold Protocol container; see /app/NOTICE.md for asset terms
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            io.github.stronghold-protocol.upstream=https://github.com/${{ env.UPSTREAM_REPOSITORY }}/tree/${{ steps.metadata.outputs.sha }}
            io.github.stronghold-protocol.recipe-revision=${{ github.sha }}
            io.github.stronghold-protocol.assets=${{ env.FETCH_ASSETS }}
          cache-from: |
            type=gha,scope=amd64-assets${{ env.FETCH_ASSETS }}
            type=gha,scope=arm64-assets${{ env.FETCH_ASSETS }}
          provenance: mode=max
          sbom: true

      - name: Write build summary
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          UPSTREAM_SHA: ${{ steps.metadata.outputs.sha }}
          PUBLISHED: ${{ steps.metadata.outputs.publish }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Stronghold Protocol image'
            echo "- Upstream: https://github.com/$UPSTREAM_REPOSITORY/tree/$UPSTREAM_SHA"
            echo "- Downloaded assets: $FETCH_ASSETS"
            echo "- Published: $PUBLISHED"
            if [ "$PUBLISHED" = true ]; then
              echo "- Pull by digest: $IMAGE@$DIGEST"
              echo '### Tags'
              printf '%s\n' "$IMAGE_TAGS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
