          - 'Stronghold-Protocol-Forge-Mods + 夜间高对比主题 [forge/theme-night]'
          - 'Stronghold-Protocol-Forge-Mods + 装备拆卸mod [forge/unequip]'
          - 'Stronghold-Protocol-Forge-Mods + WS 压缩参考（协商参数 / 档位 / 实测） [forge/ws-compression-reference]'
          - 'Stronghold-Protocol-Lele-Mods + 伤害统计 [lele/lele-damage]'
          - 'Stronghold-Protocol-Lele-Mods + 更多阵营 [lele/lele-factions]'
          - 'Stronghold-Protocol-Lele-Mods + 恭喜发财 [lele/lele-lucky]'
          - 'Stronghold-Protocol-Lele-Mods + 新干员包 [lele/lele-operators]'
          - 'Stronghold-Protocol-Lele-Mods + 额外干员包 [lele/lele-recruits]'
          - 'Stronghold-Protocol-Lele-Mods + 收藏品玩法 [lele/lele-relics]'
          - 'Stronghold-Protocol-Lele-Mods + 额外 4 回合 [lele/lele-rounds]'
          - 'Stronghold-Protocol-Lele-Mods + 定向甄选 [lele/lele-targeted]'
      # END GENERATED PLUGIN INPUTS
  workflow_call:
    inputs:
      upstream_ref:
        type: string
        default: ''
      include_assets:
        type: boolean
        default: true
      image_tag:
        type: string
        default: ''
      plugins:
        type: string
        default: ''
      automatic:
        description: 'Internal vanilla poll; unavailable in the manual dispatch form'
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Serialize publishers on the default branch so an older run cannot overwrite a newer latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REPOSITORY: sganggs/Stronghold-Protocol
  REQUESTED_REF: ${{ inputs.upstream_ref || vars.UPSTREAM_REF || 'latest' }}
  NODE_IMAGE: ${{ vars.NODE_IMAGE || 'node:22-alpine' }}
  SELECTED_PLUGINS: ${{ inputs.plugins || '' }}
  IMAGE_TAG: ${{ inputs.image_tag || '' }}
  AUTOMATED_BUILD: ${{ inputs.automatic && 'true' || 'false' }}
  # PRs validate the recipe without the large asset download. Manual choices override variables.
  FETCH_ASSETS: >-
    ${{ github.event_name == 'pull_request' && '0' ||
        (github.event_name == 'workflow_dispatch' || inputs.automatic) && (inputs.include_assets && '1' || '0') ||
        vars.FETCH_ASSETS || '1' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      image: ${{ steps.metadata.outputs.image }}
      tags: ${{ steps.metadata.outputs.tags }}
      publish: ${{ steps.metadata.outputs.publish }}
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.metadata.outputs.version }}
      version_tag: ${{ steps.metadata.outputs.version_tag }}
      local_assets: ${{ steps.upstream.outputs.release_tag != '' && env.FETCH_ASSETS == '1' }}
      bundle_digest: ${{ steps.assets.outputs.digest }}
      plugins: ${{ steps.plugins.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate plugin selection and tag policy before downloads
        id: plugins
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/validate-plugin-inputs.mjs
      - name: Test image publishing rules
        run: node --test tests/*.test.mjs
      - name: Test release asset validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify generated plugin selectors
        run: node scripts/generate-plugin-workflows.mjs --check
      - name: Validate workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
      - name: Validate Compose configuration
        env:
          IMAGE: ghcr.io/example/stronghold-protocol-action:latest
        run: docker compose config --quiet
      - name: Resolve upstream Release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-upstream.mjs

      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          persist-credentials: false

      # Resolve a moving branch once so both native builders use exactly the same source.
      - name: Resolve image tags and source revision
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          IS_LATEST_RELEASE: ${{ steps.upstream.outputs.is_latest }}
          SELECTED_PLUGINS: ${{ steps.plugins.outputs.selection }}
        run: |
          UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)
          export UPSTREAM_SHA
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          node scripts/image-metadata.mjs

      - name: Check whether this Release is already published
        id: check
        env:
          CHECK_PUBLISHED: ${{ inputs.automatic == true }}
          VERSION_TAG: ${{ steps.metadata.outputs.check_tag }}
          LATEST_TAG: ${{ steps.upstream.outputs.is_latest == 'true' && steps.metadata.outputs.latest_tag || '' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_LOCAL_ASSETS: ${{ steps.upstream.outputs.release_tag != '' && env.FETCH_ASSETS == '1' && '1' || '0' }}
        run: node scripts/check-release-image.mjs

      - name: Prepare all verified art from the matching full Release
        id: assets
        if: steps.check.outputs.build == 'true' && steps.upstream.outputs.release_tag != '' && env.FETCH_ASSETS == '1' && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: python3 scripts/prepare-release-assets.py --tag "$RELEASE_TAG" --destination "$RUNNER_TEMP/release-assets"

      - name: Share verified art with both architecture builds
        if: steps.assets.outcome == 'success' && steps.plugins.outputs.selection == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1
          # PNG/audio/model files are already compressed; avoid recompressing the full art bundle.
          compression-level: 0

      - name: Resolve latest plugin sources once and prepare selected packages
        if: steps.check.outputs.build == 'true' && steps.plugins.outputs.selection != ''
        env:
          SELECTED_PLUGINS: ${{ steps.plugins.outputs.selection }}
          RELEASE_ART: ${{ steps.assets.outcome == 'success' && 'true' || 'false' }}
        run: |
          if [[ "$RELEASE_ART" == true ]]; then
            cp -R "$RUNNER_TEMP/release-assets/public/." upstream/public/
            cp -R "$RUNNER_TEMP/release-assets/data/." upstream/data/
          fi
          node scripts/prepare-plugins.mjs upstream
          tar --exclude=.git --exclude=node_modules --exclude=.cache -C upstream -czf "$RUNNER_TEMP/plugin-source.tar.gz" .
          cat upstream/plugin-build.json >> "$GITHUB_STEP_SUMMARY"

      - name: Share identical prepared plugin source and art with both architectures
        if: steps.check.outputs.build == 'true' && steps.plugins.outputs.selection != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-source
          path: ${{ runner.temp }}/plugin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Preserve plugin provenance and import diagnostics
        if: always() && steps.plugins.outputs.selection != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-reports
          path: |
            upstream/plugin-build.json
            upstream/plugin-build-reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: validate
    if: needs.validate.outputs.build == 'true' && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: Build and test (${{ matrix.arch }})
    # Node/npm can SIGILL under QEMU; build and run each image on its native CPU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out resolved upstream commit
        if: needs.validate.outputs.plugins == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.validate.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Download prepared plugin source
        if: needs.validate.outputs.plugins != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-source
          path: ${{ runner.temp }}/plugin-source

      - name: Unpack prepared plugin source
        if: needs.validate.outputs.plugins != ''
        run: |
          mkdir -p upstream
          tar -xzf "$RUNNER_TEMP/plugin-source/plugin-source.tar.gz" -C upstream

      - name: Download verified release art
        if: needs.validate.outputs.local_assets == 'true' && needs.validate.outputs.plugins == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: upstream/.container-assets

      - name: Verify native runner architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          case "$TARGET_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo 'Runner CPU does not match target architecture' >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upload candidates by digest only. Deployment tags are updated after BOTH smoke tests pass.
      - name: Build native image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: ${{ needs.validate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.validate.outputs.image) || 'type=docker' }}
          tags: ${{ needs.validate.outputs.publish != 'true' && 'stronghold-test:local' || '' }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            FETCH_ASSETS=${{ env.FETCH_ASSETS }}
            INCLUDE_LOCAL_ASSETS=${{ needs.validate.outputs.local_assets == 'true' && '1' || '0' }}
            PREPARED_PLUGINS=${{ needs.validate.outputs.plugins != '' && '1' || '0' }}
          labels: |
            org.opencontainers.image.title=Stronghold Protocol
            org.opencontainers.image.description=Unofficial Stronghold Protocol container; see /app/NOTICE.md for asset terms
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            io.github.stronghold-protocol.upstream=https://github.com/${{ env.UPSTREAM_REPOSITORY }}/tree/${{ needs.validate.outputs.sha }}
            io.github.stronghold-protocol.recipe-revision=${{ github.sha }}
            io.github.stronghold-protocol.assets=${{ env.FETCH_ASSETS }}
            io.github.stronghold-protocol.local-assets=${{ needs.validate.outputs.local_assets == 'true' && 'release' || 'none' }}
            io.github.stronghold-protocol.asset-source=${{ needs.validate.outputs.local_assets == 'true' && 'release-bundle' || (env.FETCH_ASSETS == '1' && 'download' || 'none') }}
            io.github.stronghold-protocol.release-bundle-digest=${{ needs.validate.outputs.bundle_digest }}
            io.github.stronghold-protocol.plugins=${{ needs.validate.outputs.plugins }}
          cache-from: type=gha,scope=${{ matrix.arch }}-assets${{ env.FETCH_ASSETS }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-assets${{ env.FETCH_ASSETS }}
          provenance: ${{ needs.validate.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.validate.outputs.publish == 'true' }}

      - name: Test exact image on native CPU
        env:
          IMAGE_REF: ${{ needs.validate.outputs.publish == 'true' && format('{0}@{1}', needs.validate.outputs.image, steps.image.outputs.digest) || 'stronghold-test:local' }}
          PLATFORM: linux/${{ matrix.arch }}
          EXPECT_LOCAL_ASSETS: ${{ needs.validate.outputs.local_assets == 'true' && '1' || '0' }}
          EXPECT_PLUGINS: ${{ needs.validate.outputs.plugins }}
        run: bash scripts/smoke-image.sh "$IMAGE_REF" "$PLATFORM"

      - name: Record tested image digest
        if: needs.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.digest"

      - name: Upload tested digest
        if: needs.validate.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest without rebuilding
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          IMAGE_TAGS: ${{ needs.validate.outputs.tags }}
          LOCAL_ASSETS_MODE: ${{ needs.validate.outputs.local_assets == 'true' && 'release' || 'none' }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --annotation "index:io.github.stronghold-protocol.local-assets=$LOCAL_ASSETS_MODE" "${tags[@]}" "${sources[@]}"
          first_tag=${IMAGE_TAGS%%$'\n'*}
          docker buildx imagetools inspect "$first_tag" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          docker buildx imagetools inspect "$first_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Write build summary
        env:
          IMAGE_TAGS: ${{ needs.validate.outputs.tags }}
          UPSTREAM_SHA: ${{ needs.validate.outputs.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo '## Stronghold Protocol image'
            echo "- Upstream: https://github.com/$UPSTREAM_REPOSITORY/tree/$UPSTREAM_SHA"
            echo "- Version: $VERSION"
            echo "- Downloaded assets: $FETCH_ASSETS"
            echo '- Built and smoke-tested on native amd64 and arm64 runners'
            echo '### Published tags'
            printf '%s\n' "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  dockerhub:
    name: Optional Docker Hub mirror
    needs: [validate, publish]
    # A dispatched GHCR cache hit still needs a mirror check (new credentials or a failed prior copy).
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.publish == 'true' &&
      (needs.publish.result == 'success' || (needs.validate.outputs.build == 'false' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check optional Docker Hub configuration
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: node scripts/dockerhub.mjs configure
      - name: Install registry copy tool
        if: steps.hub.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Log in to source and destination registries
        if: steps.hub.outputs.enabled == 'true'
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/dockerhub-auth.json
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GHCR_USER" --password-stdin ghcr.io
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: Mirror tested images and verify digests
        if: steps.hub.outputs.enabled == 'true'
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/dockerhub-auth.json
          IMAGE: ${{ needs.validate.outputs.image }}
          IMAGE_TAGS: ${{ needs.validate.outputs.tags }}
          VERSION_TAG: ${{ needs.validate.outputs.version_tag }}
          DOCKERHUB_REPOSITORY: ${{ steps.hub.outputs.repository }}
        run: node scripts/dockerhub.mjs mirror
      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/dockerhub-auth.json"
